<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Artisan Pizza Co.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/tracker.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container flex align-center justify-between" style="height: 100%;">
            <a href="../index.html" class="logo">
                <i class="fas fa-pizza-slice icon"></i> Artisan Pizza Co.
            </a>
            <div class="flex align-center gap-2">
                <a href="menu.html" style="font-weight: 500;">Order Again</a>
            </div>
        </div>
    </header>

    <div class="tracker-container">
        <div class="order-id">Order #849201</div>
        <div class="status-header">
            <h1>Out for Delivery</h1>
        </div>
        <div class="eta">Arriving in 12 mins</div>

        <div class="progress-track">
            <div class="step completed">
                <i class="fas fa-check"></i>
                <div class="step-label">Order Placed</div>
            </div>
            <div class="step completed">
                <i class="fas fa-fire"></i>
                <div class="step-label">Baking</div>
            </div>
            <div class="step active">
                <i class="fas fa-motorcycle"></i>
                <div class="step-label">On the Way</div>
            </div>
            <div class="step">
                <i class="fas fa-home"></i>
                <div class="step-label">Delivered</div>
            </div>
        </div>

        <div class="map-visual">
            <!-- Simulated Map Background Pattern -->
            <div
                style="position: absolute; width: 100%; height: 100%; background-image: radial-gradient(#ccc 2px, transparent 2px); background-size: 20px 20px; opacity: 0.5;">
            </div>
            <div class="pulse-rings"></div>
            <span
                style="z-index: 2; position: relative; font-weight: 600; background: white; padding: 4px 12px; border-radius: 20px;">Live
                Map View</span>
        </div>

        <div class="driver-info">
            <div class="driver-avatar">
                <img src="https://via.placeholder.com/60" style="width: 100%; height: 100%; object-fit: cover;"
                    alt="Driver">
            </div>
            <div style="flex: 1;">
                <h3 style="margin-bottom: 4px;">Mike is driving</h3>
                <p style="font-size: 0.9rem; color: #666;">Toyota Prius • License 8XJ-291</p>
            </div>
            <div style="flex-shrink: 0;">
                <button class="btn btn-secondary" style="border-radius: 50%; width: 48px; height: 48px; padding: 0;"><i
                        class="fas fa-phone"></i></button>
            </div>
        </div>

    </div>

</body>

</html>
